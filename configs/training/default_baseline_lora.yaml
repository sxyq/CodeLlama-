# DEFAULT-LORA-001 — strict LLaMA-Factory default baseline
# Pinned commit: 97b32d3133b501432141a82949d5c7bc4d94f23a
# Only path/dataset/project-required fields and values identical to defaults are written.
# Base model is READ ONLY. Outputs stay under $HOME/codellama-lora.

### model
model_name_or_path: /data/vllm/CodeLlama-13b-Instruct-hf
disable_gradient_checkpointing: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0
lora_target: all

### dataset
dataset: codellama_asm_pseudo_to_cpp
dataset_dir: /home/syy/codellama-lora/configs/datasets
template: llama2
cutoff_len: 2048
packing: false
train_on_prompt: false
val_size: 0

### output
output_dir: /home/syy/codellama-lora/outputs/default_baseline_lora
logging_dir: /home/syy/codellama-lora/logs/training/default_baseline_lora

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
bf16: true
seed: 42
