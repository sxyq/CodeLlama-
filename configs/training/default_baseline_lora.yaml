# DEFAULT-LORA-001
# CodeLlama-13B LoRA SFT baseline (explicit fields; do not rely on implicit defaults)
# READ-ONLY base model. All outputs stay under $HOME/codellama-lora.

### model
model_name_or_path: /data/vllm/CodeLlama-13b-Instruct-hf
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0
lora_target: all
# explicit empty / false baselines from pinned defaults
additional_target: null
use_rslora: false
use_dora: false

### dataset
dataset: codellama_asm_pseudo_to_cpp
dataset_dir: /home/syy/codellama-lora/configs/datasets
template: llama2
cutoff_len: 2048
packing: false
neat_packing: false
train_on_prompt: false
mask_history: false
val_size: 0
max_samples: null
preprocessing_num_workers: 4

### precision / memory
bf16: true
fp16: false
gradient_checkpointing: false

### output
output_dir: /home/syy/codellama-lora/outputs/default_baseline_lora
logging_dir: /home/syy/codellama-lora/logs/training/default_baseline_lora
logging_steps: 5
save_steps: 100
save_total_limit: null
overwrite_output_dir: true
plot_loss: true
report_to: none
seed: 42

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 0
warmup_ratio: 0.0
optim: adamw_torch
max_grad_norm: 1.0
dataloader_drop_last: false
dataloader_num_workers: 0

### eval / test intentionally disabled
do_eval: false
eval_strategy: "no"
